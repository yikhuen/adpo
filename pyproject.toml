[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-dpo"
version = "0.1.0"
description = "Adaptive KL-controlled DPO training and evaluation pipelines"
authors = [{ name = "Adaptive DPO Authors" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "accelerate",
    "bitsandbytes",
    "datasets>=3.4.1,<4.0.0",
    "hf_transfer",
    "huggingface_hub>=0.34.0",
    "matplotlib",
    "openai>=1.40.0",
    "peft",
    "protobuf",
    "requests>=2.31.0",
    "pydantic",
    "pyyaml",
    "seaborn",
    "sentencepiece",
    "transformers==4.55.4",
    "trl==0.22.2",
    "typer[all]>=0.9",
    "unsloth",
    "wandb",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], include = ["adaptive_dpo", "adaptive_dpo.*"]}}

[tool.pytest.ini_options]
pythonpath = ["src"]

