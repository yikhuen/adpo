[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-dpo"
version = "0.1.0"
description = "Adaptive KL-controlled DPO training and evaluation pipelines"
authors = [{ name = "Adaptive DPO Authors" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"], include = ["adaptive_dpo", "adaptive_dpo.*"]}}

