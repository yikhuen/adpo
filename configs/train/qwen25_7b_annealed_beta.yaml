# Training config for Qwen2.5-7B-Instruct with cosine-annealed beta schedule
project: adaptive-dpo
seed: 42
seeds: [42]

method:
  name: annealed

model:
  name: Qwen/Qwen2.5-7B-Instruct
  max_seq_length: 4096
  load_in_4bit: true
  dtype: null

dataset:
  alias: ultrafeedback
  splits:
    train: train_prefs
    eval: test_prefs
  sample_frac: 0.005

fixed_beta: 0.20  # starting beta for schedule

beta_schedule:
  beta_start: 0.20
  beta_end: 0.05
  schedule: cosine

trainer:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  num_train_epochs: 1
  max_steps: 120
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.0
  lr_scheduler_type: linear
  output_dir: outputs/annealed_beta
  report_to: wandb
  max_length: 1024
  max_prompt_length: 512
  train_split: train

