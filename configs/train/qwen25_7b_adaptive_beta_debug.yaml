project: adaptive-dpo
seed: 0
seeds: [0]

model:
  name: Qwen/Qwen2.5-7B-Instruct
  max_seq_length: 4096
  load_in_4bit: true
  dtype: null

dataset:
  alias: ultrafeedback
  splits:
    train: train_prefs
    eval: test_prefs
  sample_frac: 0.0005

beta_controller:
  kind: robust_hybrid
  target_kl: 0.05
  beta_init: 0.10
  beta_min: 0.01
  beta_max: 2.0
  eta: 1.0
  ema_alpha: 0.10
  deadband: 0.10
  lambda_entropy: 5.0
  vocab_size: 32000
  entropy_warmup_steps: 50

trainer:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  warmup_ratio: 0.0
  num_train_epochs: 1
  max_steps: 10
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.0
  lr_scheduler_type: linear
  output_dir: outputs/debug_adaptive_beta
  report_to: wandb
  max_length: 512
  max_prompt_length: 256
  train_split: train
  high_kl_threshold: 0.20

