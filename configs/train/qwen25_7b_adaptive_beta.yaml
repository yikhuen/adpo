# Training config for Qwen2.5-7B-Instruct with Adaptive Beta (per-token KL)
seed: 42
project: adaptive-dpo

model:
  name: Qwen/Qwen2.5-7B-Instruct
  max_seq_length: 4096
  load_in_4bit: true
  dtype: null

beta_controller:
  kl_target: 0.03           # nats/token
  eta: 0.02
  ema_alpha: 0.10
  beta_init: 0.10
  beta_min: 0.02
  beta_max: 3.0
  deadband_ratio: 0.20      # ±20%

trainer:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 12
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  num_train_epochs: 1
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.0
  lr_scheduler_type: linear
  output_dir: outputs
  report_to: wandb
  max_length: 1024
  max_prompt_length: 512

# Dataset settings
# Use UltraFeedback binarized, small subsample for a quick demo
# splits train_prefs/test_prefs map to train/test

dataset:
  name: HuggingFaceH4/ultrafeedback_binarized
  sample_frac: 0.005
  splits:
    - train_prefs
    - test_prefs
