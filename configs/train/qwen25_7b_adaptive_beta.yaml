# Training config for Qwen2.5-7B-Instruct with Adaptive Beta (per-token KL)
project: adaptive-dpo
seed: 42
seeds: [42]

model:
  name: Qwen/Qwen2.5-7B-Instruct
  max_seq_length: 4096
  load_in_4bit: true
  dtype: null

dataset:
  alias: ultrafeedback
  splits:
    train: train_prefs
    eval: test_prefs
  sample_frac: 0.005

beta_controller:
  kind: robust_hybrid
  target_kl: 0.04
  beta_init: 0.10
  beta_min: 0.05
  beta_max: 2.0
  eta: 0.01
  ema_alpha: 0.10
  deadband: 0.10
  lambda_entropy: 4.0
  vocab_size: 32000
  entropy_warmup_steps: 10

trainer:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  num_train_epochs: 1
  max_steps: 120
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.0
  lr_scheduler_type: linear
  output_dir: outputs/adaptive_beta
  report_to: wandb
  max_length: 1024
  max_prompt_length: 512
  train_split: train
  high_kl_threshold: 0.20
