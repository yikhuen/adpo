# Training config for Qwen2.5-7B-Instruct with Adaptive Beta (per-token KL)
project: adaptive-dpo
seed: 42
seeds: [42]

model:
  name: Qwen/Qwen2.5-7B-Instruct
  max_seq_length: 4096
  load_in_4bit: true
  dtype: null

dataset:
  alias: ultrafeedback
  splits:
    train: train_prefs
    eval: test_prefs
  sample_frac: 0.005

beta_controller:
  kind: hybrid_entropy
  target_kl: 0.03           # nats/token
  alpha_rate: 0.01
  lambda_entropy: 1.0
  vocab_size: 32000
  entropy_warmup_steps: 200
  beta_init: 0.10
  beta_min: 0.02
  beta_max: 3.0

trainer:
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 12
  learning_rate: 5.0e-6
  warmup_ratio: 0.1
  num_train_epochs: 1
  logging_steps: 1
  optim: adamw_8bit
  weight_decay: 0.0
  lr_scheduler_type: linear
  output_dir: outputs/adaptive_beta
  report_to: wandb
  max_length: 1024
  max_prompt_length: 512
  train_split: train
